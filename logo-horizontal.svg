<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-grad-h" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b3" />
      <stop offset="35%" stop-color="#f6cf67" />
      <stop offset="70%" stop-color="#d49b28" />
      <stop offset="100%" stop-color="#996a12" />
    </linearGradient>

    <radialGradient id="bg-glow-h" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a3b5c" />
      <stop offset="100%" stop-color="#0b101a" />
    </radialGradient>

    <filter id="glow-h" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ícone Circular à Esquerda -->
  <g transform="translate(10, 10)">
    <!-- Base Circular -->
    <circle cx="30" cy="30" r="28" fill="url(#bg-glow-h)" stroke="url(#gold-grad-h)" stroke-width="1.5" />
    <circle cx="30" cy="30" r="24" fill="none" stroke="url(#gold-grad-h)" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />

    <!-- 7 Raios Sutis -->
    <g opacity="0.5" stroke="url(#gold-grad-h)" stroke-width="1" stroke-linecap="round">
      <line x1="30" y1="30" x2="16" y2="16" />
      <line x1="30" y1="30" x2="21" y2="12" />
      <line x1="30" y1="30" x2="26" y2="9" />
      <line x1="30" y1="30" x2="30" y2="8" />
      <line x1="30" y1="30" x2="34" y2="9" />
      <line x1="30" y1="30" x2="39" y2="12" />
      <line x1="30" y1="30" x2="44" y2="16" />
    </g>

    <!-- Cruz Sagrada -->
    <!-- Vertical -->
    <rect x="27.5" y="16" width="5" height="28" rx="1.5" fill="url(#gold-grad-h)" />
    <!-- Horizontal -->
    <rect x="18" y="23" width="24" height="5" rx="1.5" fill="url(#gold-grad-h)" />
    <!-- Brilho Central -->
    <circle cx="30" cy="25.5" r="2" fill="#ffffff" filter="url(#glow-h)" />
  </g>

  <!-- Tipografia do Logotipo -->
  <text x="85" y="38" 
        font-family="'Cinzel', 'Georgia', serif" 
        font-size="22" 
        font-weight="800" 
        letter-spacing="2.5" 
        fill="url(#gold-grad-h)">
    7 DIAS COM JESUS
  </text>

  <text x="86" y="55" 
        font-family="'Outfit', sans-serif" 
        font-size="10.5" 
        font-weight="500" 
        letter-spacing="4" 
        fill="#94a3b8">
    UMA JORNADA DE FÉ E PAZ
  </text>
</svg>
